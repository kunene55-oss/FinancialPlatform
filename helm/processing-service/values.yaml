# Default values for processing-service.
# values-dev.yaml / values-qa.yaml / values-prod.yaml override only what
# differs per environment (image tag, replicas, resources, secret names).

nameOverride: ""
fullnameOverride: ""

replicaCount: 1

image:
  repository: registry.example.com/financial-platform/processing-service
  tag: "0.0.4-SNAPSHOT"
  pullPolicy: IfNotPresent

containerPort: 8080

configServerUser: configclient

env: []
extraEnvFrom: []

secrets:
  configServerPassword:
    existingSecret: "configserver-credentials"
    secretKey: password
  vaultApprole:
    enabled: true
    existingSecret: "processing-service-vault-approle"
    roleIdKey: role-id
    secretIdKey: secret-id

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 768Mi

probes:
  enabled: true
  type: http
  path: /actuator/health
  initialDelaySeconds: 30
  readinessInitialDelaySeconds: 15
  periodSeconds: 10

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 75

service:
  type: ClusterIP
  port: 8080

serviceAccount:
  create: true
  name: ""
  annotations: {}

ingress:
  enabled: false

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
